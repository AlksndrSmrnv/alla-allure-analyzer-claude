name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      # -rs: причины пропусков в журнале (на Linux пропускаются проверки macOS и её системных ссылок).
      - name: pytest (without loopback)
        id: offline
        run: python -m pytest -m 'not loopback'
      - name: pytest (real loopback HTTP)
        if: ${{ !cancelled() && (success() || steps.offline.outcome == 'failure') }}
        run: python -m pytest -m loopback
      - name: ruff
        run: ruff check scripts extensions tests
      # Версия — из матрицы: на 3.12 ставится numpy без поддержки 3.11, и его заглушки
      # с синтаксисом 3.12 не разбираются при python_version = "3.11" из pyproject.toml.
      - name: mypy
        run: mypy --python-version ${{ matrix.python }} scripts extensions
      # Только dev: holdout проверяет test_eval_quality, отдельно его не печатаем.
      - name: Eval (dev)
        run: python tests/eval/run_eval.py

  # Ручная подготовка инженером, read-only setup и синтетический разбор в Debian.
  setup-smoke:
    name: engineer setup and read-only checks (python:3.11 container)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: python:3.11
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local wheelhouse explicitly
        run: >-
          python -m pip download --require-hashes --only-binary=:all:
          -r requirements.txt --dest /tmp/alla-wheelhouse
      - name: Manual environment, read-only instructions, check and prepare
        env:
          ALLA_WHEELHOUSE: /tmp/alla-wheelhouse
        run: bash .github/scripts/skill_setup_smoke.sh
