# Репозиторий содержит только скилл Qwen Code alla-launch (qwen-skill/alla-launch/);
# пакета для установки нет. Зависимости: qwen-skill/alla-launch/requirements*.txt.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["qwen-skill/alla-launch/tests"]
