# Репозиторий — нативный Qwen Code CLI extension `alla`;
# пакета для установки нет. Зависимости: requirements*.txt.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

# У этих библиотек нет аннотаций (scipy-stubs не ставим ради одного импорта): без исключения
# mypy ругается на сам импорт.
[[tool.mypy.overrides]]
module = ["ijson", "ijson.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

# scripts/ попадает в sys.path только во время работы (alla_skill.py, skill_fixtures),
# поэтому pyright указываются пути к пакетам расширения и к фикстурам тестов. Pyright нужен
# для навигации по коду; типы проверяет mypy, а режим basic даёт ложные ошибки на
# алиасах pydantic (contentType) и argparse.
[tool.pyright]
include = ["scripts", "extensions", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "off"
extraPaths = ["scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["loopback: starts a real HTTP server on 127.0.0.1"]
addopts = "-rs"
