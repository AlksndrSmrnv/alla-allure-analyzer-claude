<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Оформление заказа</title>
<style>
body{margin:0;font-family:Helvetica,Arial,sans-serif;background:#f4f5f7;width:800px;height:800px;position:relative}
header{background:#2b3a55;color:#fff;padding:14px 24px;font-size:20px}
.form{margin:28px 24px;background:#fff;padding:20px;border-radius:6px;width:420px}
.row{margin:10px 0;color:#333;font-size:16px}
button{background:#1f7a3a;color:#fff;border:0;padding:12px 28px;font-size:17px;border-radius:4px}
.overlay{position:absolute;left:0;top:0;width:800px;height:800px;background:rgba(0,0,0,.45)}
.cookie{position:absolute;left:150px;top:150px;width:500px;background:#fff;padding:22px 26px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.cookie h2{margin:0 0 10px;font-size:22px;color:#111}
.cookie p{margin:0 0 16px;font-size:16px;color:#333;line-height:1.4}
.cookie .accept{background:#2b6cd4}
</style></head><body>
<header>Магазин · Оформление заказа</header>
<div class="form">
<div class="row">Товары: 2 шт. · Итого: 3 490 ₽</div>
<div class="row">Доставка: курьером, завтра</div>
<div class="row"><button id="pay-button">Оплатить</button></div>
</div>
<div class="overlay"></div>
<div class="cookie"><h2>Мы используем cookie</h2>
<p>Продолжая работу с сайтом, вы соглашаетесь на обработку файлов cookie.</p>
<button class="accept">Принять</button></div>
</body></html>
